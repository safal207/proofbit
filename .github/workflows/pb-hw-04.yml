name: pb-hw-04

on:
  pull_request:
  push:
    branches:
      - feat/pb-hw-04

jobs:
  physical-proof-memory-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source RTL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 2
          yosys -V
      - name: PB-HW-04 accounting tests
        run: python -m unittest tests.test_pb_hw_04 -v
      - name: Simulate and synthesize PB-HW-04
        run: |
          if ! python benchmarks/pb_hw_04.py --json > /tmp/pb_hw_04.json 2> /tmp/pb_hw_04.err; then
            echo "=== PB-HW-04 synthesis failure tail ==="
            tail -n 120 /tmp/pb_hw_04.err
            exit 1
          fi
          python -m json.tool /tmp/pb_hw_04.json
      - name: Validate frozen PB-HW-04 oracle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/pb_hw_04.json').read_text())
          assert r['benchmark_id']=='PB-HW-04'
          assert r['version']=='0.1'
          assert r['protocol']=='PB-HW-04/v0.1 physical-proof-memory-cache-economics'
          assert r['physical_memory_instantiated'] is True
          assert r['depth_entries']==1024 and r['record_bits']==64 and r['parent_count']==4
          assert r['primary_anti_strawman']=='multiport_conventional_cache'
          assert r['no_single_winner_score'] is True

          sim=r['simulation']
          assert sim['checks']==52 and sim['failures']==0
          cold=sim['cold_latency_cycles']; warm=sim['warm_latency_cycles']
          conflict=sim['same_bank_conflict_latency_cycles']
          conflict_warm=sim['same_bank_warm_latency_cycles']
          inv=sim['post_invalidation_latency_cycles']
          assert cold=={'single_port_conventional':4,'banked_conventional':2,'multiport_conventional_cache':2,'proofbit_cache':2}
          assert warm=={'single_port_conventional':4,'banked_conventional':2,'multiport_conventional_cache':1,'proofbit_cache':1}
          assert conflict=={'single_port_conventional':4,'banked_conventional':5,'multiport_conventional_cache':2,'proofbit_cache':2}
          assert conflict_warm=={'single_port_conventional':4,'banked_conventional':5,'multiport_conventional_cache':1,'proofbit_cache':1}
          assert inv=={'single_port_conventional':4,'banked_conventional':2,'multiport_conventional_cache':2,'proofbit_cache':2}

          s=r['synthesis']
          assert s['single_port_conventional']['physical_evidence_bits']==65536
          assert s['banked_conventional']['physical_evidence_bits']==65536
          assert s['multiport_conventional_cache']['physical_evidence_bits']==262144
          assert s['proofbit_cache']['physical_evidence_bits']==262144
          assert s['single_port_conventional']['bram36_cells']==2
          assert s['banked_conventional']['bram36_cells']==4
          assert s['multiport_conventional_cache']['bram36_cells']==8
          assert s['proofbit_cache']['bram36_cells']==8
          for row in s.values():
              assert row['core_cells_excluding_io']>0
              assert row['logic_depth_proxy']>0
          eq=r['strong_conventional_vs_proofbit']
          assert all(eq.values()),eq
          PY
