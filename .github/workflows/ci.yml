name: proofbit-ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/pb-transition-01-morphos

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Baseline benchmark smoke
        run: python benchmarks/compare.py --iterations 10000 --rounds 3 --json
      - name: Contaminated-memory benchmark smoke
        run: python benchmarks/contaminated.py --iterations 10000 --rounds 2 --json
      - name: Proof-cache benchmark smoke
        run: python benchmarks/cache_sweep.py --requests 10000 --rounds 2 --json
      - name: Contamination sweep smoke
        run: python benchmarks/contamination_sweep.py --iterations 20000 --rounds 1 --json
      - name: Market matrix smoke
        run: python benchmarks/market_matrix.py --json
      - name: PB-AI-01 benchmark smoke
        run: python benchmarks/pb_ai_01.py --backend cpu-python --decisions 10000 --contamination 0.10 --json
      - name: PB-AI-01 backend registry
        run: python benchmarks/pb_ai_01.py --list-backends --json
      - name: PB-ARCH-01 reference smoke
        run: python benchmarks/pb_arch_01.py --decisions 10000 --contamination 0.10 --json
      - name: PB-TRANSITION-01 reference smoke
        run: python benchmarks/pb_transition_01.py --json

  cross-architecture-capu:
    name: PB-ARCH-01 ProofBit vs CaPU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProofBit
        uses: actions/checkout@v4

      - name: Checkout pinned CaPU adapter
        uses: actions/checkout@v4
        with:
          repository: safal207/CaPU
          ref: 8d0fb9d85415a53863ead80c4604c981b517fb5a
          path: external/CaPU

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Execute pinned CaPU PB-ARCH-01 adapter
        run: |
          cargo run --quiet \
            --manifest-path external/CaPU/rust/cmc-core/Cargo.toml \
            --bin pb_arch_01 --locked -- \
            --decisions 10000 --contamination 0.10 \
            > /tmp/capu_pb_arch_01.json
          python -m json.tool /tmp/capu_pb_arch_01.json

      - name: Aggregate ProofBit vs CaPU
        run: |
          python benchmarks/pb_arch_01.py \
            --decisions 10000 \
            --contamination 0.10 \
            --capu-json /tmp/capu_pb_arch_01.json \
            --json

  cross-architecture-morphos:
    name: PB-TRANSITION-01 MORPHOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProofBit
        uses: actions/checkout@v4

      - name: Checkout pinned MORPHOS adapter
        uses: actions/checkout@v4
        with:
          repository: safal207/COSMIC-ORGANICS
          ref: 5ff088d647e315893a38a082ed27af07669177a1
          path: external/COSMIC-ORGANICS

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute pinned MORPHOS PB-TRANSITION-01 adapter
        run: |
          (cd external/COSMIC-ORGANICS && python -m benchmarks.pb_transition_01) \
            > /tmp/morphos_pb_transition_01.json
          python -m json.tool /tmp/morphos_pb_transition_01.json

      - name: Aggregate architecture transition scorecard
        run: |
          python benchmarks/pb_transition_01.py \
            --morphos-json /tmp/morphos_pb_transition_01.json \
            --json
