name: proofbit-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Baseline benchmark smoke
        run: python benchmarks/compare.py --iterations 10000 --rounds 3 --json
      - name: Contaminated-memory benchmark smoke
        run: python benchmarks/contaminated.py --iterations 10000 --rounds 2 --json
      - name: Proof-cache benchmark smoke
        run: python benchmarks/cache_sweep.py --requests 10000 --rounds 2 --json
